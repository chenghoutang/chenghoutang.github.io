<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050708">
  <meta name="description" content="2026 NOIP 澳门赛区预测计算动画演示">
  <title>动画演示 · 2026 NOIP 澳门赛区预测</title>
  <link rel="stylesheet" href="presentation.css">
  <script src="../data.js" defer></script>
  <script src="../prediction.js" defer></script>
  <script src="presentation.js" defer></script>
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="show-header">
    <a class="show-brand" href="../index.html"><span>&lt;/&gt;</span><b>MACAU CODE ARENA</b><small>ANIMATED SCORE REVEAL</small></a>
    <div class="chapter-progress" id="chapterProgress" aria-label="演示章节进度"></div>
    <a class="exit-link" href="../index.html">退出演示 <span>↗</span></a>
  </header>

  <main id="stage" class="stage" aria-live="polite" aria-atomic="true">
    <div id="sceneRoot" class="scene-root"></div>
  </main>

  <footer class="show-controls" id="showControls" hidden>
    <div class="step-readout"><span id="stepIndex">01</span><div><b id="stepTitle">序章</b><small id="stepTime">READY</small></div></div>
    <div class="control-center">
      <label class="auto-switch"><input id="autoPlay" type="checkbox" checked><span aria-hidden="true"></span>自动过场</label>
      <button id="musicToggle" class="icon-control" type="button" aria-label="关闭音乐" title="音乐开关">♫</button>
      <button id="previousStep" class="icon-control" type="button" aria-label="上一步" title="上一步">←</button>
      <button id="nextStep" class="next-control" type="button">跳到下一步 <span>→</span></button>
    </div>
    <div class="show-credit">MYGO!!!!! CHARACTER ART<br><a href="https://anime.bang-dream.com/mygo/character/" target="_blank" rel="noopener noreferrer">© BanG Dream! Project · 官方动画网站 ↗</a></div>
    <div class="auto-timer" id="autoTimer"></div>
  </footer>

  <section class="start-overlay" id="startOverlay" aria-labelledby="startTitle">
    <div class="start-grid" aria-hidden="true"></div>
    <div class="start-panel">
      <p class="overline">MACAU CODE ARENA / PRESENTS</p>
      <h1 id="startTitle"><span>2026 NOIP</span>预测演算<span class="start-subtitle">动画演示</span></h1>
      <p class="start-copy">从上赛季战绩，到新赛季最终预测。<br>戴上耳机，见证 171 位选手的数据化为赛场。</p>
      <label class="start-auto"><input id="startAuto" type="checkbox" checked><span class="checkmark">✓</span><span><b>自动过场</b><small>约 80–90 秒完整播放，也可随时跳到下一步</small></span></label>
      <button id="startShow" class="start-button" type="button"><span class="play-icon">▶</span><span>启动演算<small>音乐将在点击后播放</small></span><i>↗</i></button>
      <p class="fiction-note">自动播放约 80–90 秒；毕业旅行时间冲突名单与主预测页同步。</p>
    </div>
    <div class="start-code" aria-hidden="true"><span>DATASET</span> 2025–2026<br><span>PLAYERS</span> 171<br><span>STATUS</span> READY_</div>
  </section>
</body>
</html>
