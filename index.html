<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DengDuck の 小窝</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-warm-1: #fff6ec;
            --bg-warm-2: #ffe8d2;
            --bg-warm-3: #ffd9b8;
            --card-bg: rgba(255, 252, 247, 0.92);
            --text-main: #5a4130;
            --text-soft: #8a6f58;
            --accent: #e8913f;
            --accent-deep: #d97a2b;
            --accent-soft: #f6c084;
            --pink: #f2a9a0;
            --border-warm: #f0ddc6;
            --shadow-soft: 0 10px 40px rgba(186, 124, 58, 0.15);
            --shadow-hover: 0 16px 48px rgba(186, 124, 58, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', '宋体', 'PingFang SC', 'Microsoft YaHei', serif;
            color: var(--text-main);
            background: linear-gradient(160deg, var(--bg-warm-1) 0%, var(--bg-warm-2) 55%, var(--bg-warm-3) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            position: relative;
        }

        /* ===== 漂浮装饰 ===== */
        .deco {
            position: fixed;
            pointer-events: none;
            user-select: none;
            opacity: 0.55;
            z-index: 0;
            animation: drift linear infinite;
        }

        .deco.d1 { top: 8%;  left: 6%;  font-size: 2.6rem; animation-duration: 14s; }
        .deco.d2 { top: 18%; right: 8%; font-size: 2.1rem; animation-duration: 18s; animation-delay: -4s; }
        .deco.d3 { bottom: 14%; left: 10%; font-size: 2.3rem; animation-duration: 16s; animation-delay: -8s; }
        .deco.d4 { bottom: 22%; right: 12%; font-size: 2.8rem; animation-duration: 20s; animation-delay: -2s; }
        .deco.d5 { top: 48%; left: 3%;  font-size: 1.7rem; animation-duration: 12s; animation-delay: -6s; }
        .deco.d6 { top: 55%; right: 4%; font-size: 1.9rem; animation-duration: 15s; animation-delay: -10s; }

        @keyframes drift {
            0%   { transform: translateY(0) rotate(-4deg); }
            50%  { transform: translateY(-26px) rotate(5deg); }
            100% { transform: translateY(0) rotate(-4deg); }
        }

        /* ===== 主卡片 ===== */
        .home-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            padding: 48px 40px 40px;
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .home-card::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 2px dashed var(--border-warm);
            border-radius: 20px;
            pointer-events: none;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== 头像 ===== */
        .duck {
            line-height: 1;
            display: inline-block;
            animation: bob 2.6s ease-in-out infinite;
        }

        .duck img {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 22px rgba(186, 124, 58, 0.28);
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%      { transform: translateY(-10px) rotate(3deg); }
        }

        .greeting {
            margin-top: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-deep);
            letter-spacing: 0.12em;
        }

        .greeting .dot {
            margin: 0 6px;
            color: var(--accent-soft);
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            font-size: 2.9rem;
            font-weight: 400;
            color: var(--text-main);
            margin-top: 10px;
            letter-spacing: 0.08em;
            line-height: 1.3;
        }

        .title-deco {
            margin: 14px auto 0;
            height: 2px;
            width: 120px;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
        }

        .tagline {
            margin-top: 16px;
            font-size: 1.02rem;
            color: var(--text-soft);
            font-weight: 500;
            line-height: 1.9;
            letter-spacing: 0.05em;
        }

        .tagline .heart {
            color: var(--pink);
        }

        /* ===== 入口按钮 ===== */
        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 32px;
            padding: 16px 44px;
            font-family: inherit;
            font-size: 1.18rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 45%, var(--accent-deep) 100%);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(217, 122, 43, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: btnPulse 2.4s ease-in-out infinite;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: var(--shadow-hover);
        }

        .enter-btn:active {
            transform: translateY(0) scale(0.99);
        }

        .enter-btn .arrow {
            transition: transform 0.25s ease;
        }

        .enter-btn:hover .arrow {
            transform: translateX(5px);
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(217, 122, 43, 0.35); }
            50%      { box-shadow: 0 8px 32px rgba(217, 122, 43, 0.55); }
        }

        .enter-sub {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-soft);
            letter-spacing: 0.1em;
        }

        /* ===== 页脚 ===== */
        .footer {
            position: fixed;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-soft);
            letter-spacing: 0.08em;
            z-index: 1;
            opacity: 0.85;
        }

        .footer .heart { color: #e07a5f; }

        /* ===== 移动端 ===== */
        @media (max-width: 600px) {
            .home-card {
                padding: 40px 24px 32px;
                border-radius: 24px;
            }
            h1 { font-size: 2.3rem; }
            .duck img { width: 88px; height: 88px; }
            .enter-btn {
                padding: 14px 36px;
                font-size: 1.05rem;
            }
            .deco { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <!-- 漂浮的小装饰 -->
    <div class="deco d1">🪶</div>
    <div class="deco d2">✨</div>
    <div class="deco d3">☕</div>
    <div class="deco d4">🌙</div>
    <div class="deco d5">🍂</div>
    <div class="deco d6">⭐</div>

    <main class="home-card">
        <div class="duck"><img src="icon.png" alt="DengDuck 头像"></div>
        <div class="greeting" id="greeting">欢迎回家<span class="dot">·</span>今天也要开心呀</div>
        <h1>欢迎来到<br>DengDuck の 小窝</h1>
        <div class="title-deco"></div>
        <p class="tagline">
            这里是 Duck 的小小角落，<br>
            慢慢走，轻轻看，<span class="heart">愿你有个暖乎乎的好心情</span> 🧡
        </p>

        <a class="enter-btn" href="pinyin.html">
            <span>📖 进入字音练习</span>
            <span class="arrow">→</span>
        </a>
        <div class="enter-sub">多音字读音训练系统</div>
    </main>

    <footer class="footer">
        Made with <span class="heart">♥</span> by DengDuck · Trae 辅助生成
    </footer>

    <script>
        // 根据时间显示不同的问候语
        (function () {
            const hour = new Date().getHours();
            let text;
            if (hour >= 5 && hour < 11) {
                text = '早上好呀 · 新的一天元气满满';
            } else if (hour >= 11 && hour < 14) {
                text = '中午好 · 记得好好吃饭';
            } else if (hour >= 14 && hour < 18) {
                text = '下午好 · 来喝杯茶歇一歇';
            } else if (hour >= 18 && hour < 23) {
                text = '晚上好 · 辛苦啦，欢迎回家';
            } else {
                text = '夜深了 · 早点休息哦';
            }
            document.getElementById('greeting').textContent = text;
        })();
    </script>
</body>
</html>
