<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DengDuck の 小窝</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-warm-1: #fff6ec;
            --bg-warm-2: #ffe8d2;
            --bg-warm-3: #ffd9b8;
            --text-main: #5a4130;
            --text-soft: #8a6f58;
            --accent: #e8913f;
            --accent-deep: #d97a2b;
            --accent-soft: #f6c084;
            --pink: #f2a9a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', '宋体', 'PingFang SC', 'Microsoft YaHei', serif;
            color: var(--text-main);
            background: linear-gradient(160deg, var(--bg-warm-1) 0%, var(--bg-warm-2) 55%, var(--bg-warm-3) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 44px 20px 60px;
            position: relative;
        }

        /* 背景柔光 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { width: 420px; height: 420px; background: rgba(246, 192, 132, 0.45); top: -120px; left: -100px; }
        body::after  { width: 380px; height: 380px; background: rgba(242, 169, 160, 0.35); bottom: -120px; right: -90px; }

        /* 漂浮装饰 */
        .deco {
            position: fixed;
            pointer-events: none;
            user-select: none;
            opacity: 0.5;
            z-index: 0;
            animation: drift linear infinite;
        }
        .deco.d1 { top: 8%;  left: 5%;  font-size: 2.4rem; animation-duration: 14s; }
        .deco.d2 { top: 14%; right: 6%; font-size: 2rem;   animation-duration: 18s; animation-delay: -4s; }
        .deco.d3 { bottom: 12%; left: 8%; font-size: 2.2rem; animation-duration: 16s; animation-delay: -8s; }
        .deco.d4 { bottom: 20%; right: 5%; font-size: 2.5rem; animation-duration: 20s; animation-delay: -2s; }

        @keyframes drift {
            0%   { transform: translateY(0) rotate(-4deg); }
            50%  { transform: translateY(-26px) rotate(5deg); }
            100% { transform: translateY(0) rotate(-4deg); }
        }

        /* ===== 主布局：左卡片网格 + 右侧边栏 ===== */
        .layout {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 34px;
            align-items: stretch;
            animation: pageIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== App 图标卡网格 ===== */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            align-content: start;
        }

        .app-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            padding: 16px 16px 14px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 8px 24px rgba(186, 124, 58, 0.14);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            overflow: hidden;
            text-align: left;
            font-family: inherit;
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
        }

        .app-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 18px 40px rgba(186, 124, 58, 0.28);
        }

        .app-card:active { transform: translateY(-2px) scale(0.99); }
        .app-card:focus-visible, .folder-close:focus-visible {
            outline: 3px solid var(--accent-deep);
            outline-offset: 4px;
        }

        /* 每张卡片的淡彩渐变 */
        .c-weather { background: linear-gradient(150deg, #ffe4b5 0%, #ffc36e 100%); }
        .c-poem    { background: linear-gradient(150deg, #ffdcd6 0%, #f5aba2 100%); }
        .c-duck    { background: linear-gradient(150deg, #fff1b8 0%, #ffd86b 100%); }
        .c-pinyin  { background: linear-gradient(150deg, #d8f1ca 0%, #a2dc8b 100%); }
        .c-drug    { background: linear-gradient(150deg, #c9ecf6 0%, #8ed2ec 100%); }
        .c-book    { background: linear-gradient(150deg, #e7dbf7 0%, #c3a9ea 100%); }
        .c-hcia    { background: linear-gradient(150deg, #cfe0ff 0%, #8fb4f7 100%); }
        .c-learning { background: linear-gradient(150deg, #fce9c7 0%, #f4cd98 100%); }

        /* 学习文件夹：缩略图预览，打开后集中展示学习入口 */
        .learning-folder {
            grid-column: span 2;
            aspect-ratio: auto;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .folder-preview {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 17px 14px 13px;
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 8px 18px 18px 18px;
            background: rgba(255,255,255,.5);
            box-shadow: 0 5px 12px rgba(186,124,58,.08);
        }
        .folder-preview::before {
            content: '';
            position: absolute;
            top: -9px; left: -1px;
            width: 48%; height: 9px;
            background: rgba(255,255,255,.65);
            border: 1px solid rgba(255,255,255,.8);
            border-bottom: 0;
            border-radius: 10px 10px 0 0;
        }
        .folder-preview span {
            display: grid;
            place-items: center;
            width: 42px; height: 42px;
            border-radius: 12px;
            font-size: 1.4rem;
            transition: transform .25s ease;
        }
        .learning-folder:hover .folder-preview span:nth-child(1) { transform: translateY(-3px) rotate(-5deg); }
        .learning-folder:hover .folder-preview span:nth-child(3) { transform: translateY(-3px) rotate(5deg); }
        .folder-caption { display: flex; align-items: center; gap: 10px; }
        .folder-count { font-size: .72rem; background: rgba(255,255,255,.6); border-radius: 999px; padding: 3px 9px; }

        .folder-dialog {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(680px, calc(100% - 32px));
            max-height: calc(100dvh - 48px);
            overflow-y: auto;
            padding: 30px;
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 30px;
            background: linear-gradient(150deg, #fff9f1, #ffe8d2);
            color: var(--text-main);
            box-shadow: 0 24px 80px rgba(90,65,48,.24);
        }
        .folder-dialog::backdrop { background: rgba(70,50,35,.3); backdrop-filter: blur(8px); }
        .folder-dialog[open] { animation: cardFade .22s ease both; }
        body.folder-open { overflow: hidden; }
        .folder-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
        .folder-heading h2 { font-family: 'ZCOOL KuaiLe', serif; font-size: 1.7rem; font-weight: 400; letter-spacing: .06em; }
        .folder-close {
            flex: 0 0 auto;
            width: 44px; height: 44px;
            border: 1px solid rgba(186,124,58,.2);
            border-radius: 50%;
            font: inherit; font-size: 1.5rem;
            color: var(--text-soft); background: rgba(255,255,255,.65);
            cursor: pointer;
        }
        .folder-description { font-size: .86rem; color: var(--text-soft); line-height: 1.8; margin-bottom: 26px; }
        .folder-apps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .folder-apps .app-card { padding: 14px 10px; border-radius: 22px; min-width: 0; }
        .folder-apps .link-name { font-size: 1.1rem; }
        .folder-apps .link-sub { font-size: .7rem; letter-spacing: .02em; }
        .folder-apps .link-emoji { font-size: 2.5rem; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .card-emoji {
            font-size: 1.55rem;
            line-height: 1;
            filter: drop-shadow(0 2px 3px rgba(90, 65, 48, 0.18));
        }

        .card-tag {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: rgba(90, 65, 48, 0.75);
            background: rgba(255, 255, 255, 0.55);
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .card-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 6px 2px;
            text-align: center;
        }

        .card-bottom {
            font-size: 0.7rem;
            color: rgba(90, 65, 48, 0.66);
            letter-spacing: 0.06em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 天气卡 */
        .w-temp {
            font-size: 2.7rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }
        .w-desc { font-size: 0.95rem; font-weight: 700; margin-top: 4px; }
        .w-extra { font-size: 0.72rem; margin-top: 5px; color: rgba(90, 65, 48, 0.7); }

        /* 一言 / 鸭语录 文本 */
        .poem-text, .quote-text {
            font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', 'Noto Serif SC', serif;
            line-height: 1.6;
            letter-spacing: 0.03em;
            width: 100%;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .poem-text  { font-size: 1.02rem; -webkit-line-clamp: 5; }
        .quote-text { font-size: 1.08rem; -webkit-line-clamp: 4; }
        .poem-text .h-line { display: block; white-space: nowrap; }

        .quote-time {
            font-size: 0.68rem;
            margin-top: 6px;
            opacity: 0.7;
        }

        /* 链接型卡片（入口）*/
        .app-card.link {
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
        }
        .link-emoji {
            font-size: 3rem;
            line-height: 1;
            filter: drop-shadow(0 3px 5px rgba(90, 65, 48, 0.2));
            transition: transform 0.28s ease;
        }
        .app-card.link:hover .link-emoji { transform: scale(1.12) rotate(-6deg); }
        .link-name {
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            font-size: 1.28rem;
            font-weight: 400;
            letter-spacing: 0.06em;
        }
        .link-sub {
            font-size: 0.72rem;
            color: rgba(90, 65, 48, 0.62);
            letter-spacing: 0.1em;
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 右侧个人信息侧边栏 ===== */
        .sidebar {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 36px;
            box-shadow: 0 14px 44px rgba(186, 124, 58, 0.16);
            padding: 40px 28px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .duck {
            line-height: 1;
            display: inline-block;
            position: relative;
            animation: bob 4s ease-in-out infinite;
        }
        .duck::before {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 145, 63, 0.25) 0%, rgba(242, 169, 160, 0.15) 50%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }
        .duck::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-soft), var(--pink), var(--accent), var(--accent-soft));
            animation: ringSpin 8s linear infinite;
            z-index: 0;
        }
        .duck img {
            position: relative;
            z-index: 1;
            width: 118px;
            height: 118px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 8px 24px rgba(217, 122, 43, 0.3);
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50%      { opacity: 1; transform: scale(1.08); }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .greeting {
            display: inline-block;
            margin-top: 26px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-deep);
            letter-spacing: 0.1em;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 999px;
            padding: 7px 18px;
            box-shadow: 0 4px 14px rgba(186, 124, 58, 0.1);
        }

        .side-title {
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            font-size: 2.1rem;
            font-weight: 400;
            margin-top: 20px;
            letter-spacing: 0.06em;
            line-height: 1.4;
        }

        .title-deco {
            margin: 16px auto 0;
            height: 2px;
            width: 120px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .tagline {
            margin-top: 16px;
            font-size: 0.92rem;
            color: var(--text-soft);
            font-weight: 500;
            line-height: 1.9;
            letter-spacing: 0.04em;
        }
        .tagline .heart { color: var(--pink); font-weight: 700; }

        .side-date {
            margin-top: 18px;
            font-size: 0.8rem;
            color: var(--text-soft);
            letter-spacing: 0.12em;
        }

        .side-spacer { flex: 1; min-height: 24px; }

        .side-credit {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed rgba(186, 124, 58, 0.3);
            width: 100%;
            font-size: 0.76rem;
            color: var(--text-soft);
            letter-spacing: 0.06em;
            line-height: 1.8;
        }
        .side-credit .heart { color: #e07a5f; }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .sidebar { order: -1; }
            .app-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .learning-folder { grid-column: auto; aspect-ratio: 1 / 1; }
        }

        @media (max-width: 600px) {
            body { padding: 26px 14px 50px; }
            .app-card { border-radius: 22px; padding: 12px; }
            .card-emoji { font-size: 1.3rem; }
            .w-temp { font-size: 2.1rem; }
            .poem-text { font-size: 0.92rem; -webkit-line-clamp: 4; }
            .quote-text { font-size: 0.98rem; -webkit-line-clamp: 3; }
            .link-emoji { font-size: 2.4rem; }
            .link-name { font-size: 1.1rem; }
            .duck img { width: 96px; height: 96px; }
            .side-title { font-size: 1.7rem; }
            .sidebar { border-radius: 28px; padding: 30px 22px 24px; }
            .deco { opacity: 0.35; }
            .learning-folder { gap: 8px; }
            .folder-preview { gap: 5px; padding: 12px 9px 9px; border-radius: 7px 14px 14px 14px; }
            .folder-preview span { width: 30px; height: 30px; font-size: 1.1rem; border-radius: 9px; }
            .folder-caption { gap: 6px; }
            .folder-count { font-size: .65rem; padding: 2px 6px; }
            .learning-folder .link-sub { font-size: .65rem; letter-spacing: .02em; }
            .folder-dialog { padding: 22px 18px; border-radius: 24px; }
            .folder-apps { grid-template-columns: 1fr; gap: 12px; }
            .folder-apps .app-card { aspect-ratio: auto; min-height: 106px; padding: 16px; }
            .folder-apps .link-emoji { font-size: 2rem; }
            .folder-description { margin-bottom: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="deco d1">🪶</div>
    <div class="deco d2">✨</div>
    <div class="deco d3">☕</div>
    <div class="deco d4">🌙</div>

    <main class="layout">
        <!-- 左侧：App 图标卡网格 -->
        <section class="app-grid">

            <!-- 澳门天气 -->
            <div class="app-card c-weather" id="weatherCard" title="点击刷新天气">
                <div class="card-top">
                    <span class="card-emoji" id="wIcon">🌤️</span>
                    <span class="card-tag">澳门 · 今日</span>
                </div>
                <div class="card-main">
                    <div class="w-temp" id="wTemp">--°</div>
                    <div class="w-desc" id="wDesc">加载中…</div>
                    <div class="w-extra" id="wExtra"></div>
                </div>
                <div class="card-bottom">Open-Meteo 实时数据</div>
            </div>

            <!-- 一言 -->
            <button class="app-card c-poem" id="hitokoto" title="点击换一句">
                <div class="card-top">
                    <span class="card-emoji">📜</span>
                    <span class="card-tag">一言 · 诗词</span>
                </div>
                <div class="card-main">
                    <div class="poem-text" id="h-text">加载中…</div>
                </div>
                <div class="card-bottom" id="h-from">↻ 点击换一句</div>
            </button>

            <!-- 今日随机鸭语录 -->
            <button class="app-card c-duck" id="duckQuote" title="点击换一条">
                <div class="card-top">
                    <span class="card-emoji">🐤</span>
                    <span class="card-tag">随机鸭语录</span>
                </div>
                <div class="card-main">
                    <div class="quote-text" id="dqContent">加载中…</div>
                    <div class="quote-time" id="dqTime"></div>
                </div>
                <div class="card-bottom">↻ 点击换一条</div>
            </button>

            <!-- 学习文件夹 -->
            <button class="app-card c-learning learning-folder" id="learningFolder" type="button"
                aria-haspopup="dialog" aria-controls="learningDialog" aria-expanded="false">
                <span class="folder-preview" aria-hidden="true">
                    <span class="c-pinyin">📖</span><span class="c-drug">💊</span><span class="c-hcia">🌐</span>
                </span>
                <span class="folder-caption"><span class="link-name">学习</span><span class="folder-count">3 项</span></span>
                <span class="link-sub">字音 · 禁毒 · 网络知识</span>
            </button>

            <!-- 语录集 -->
            <a class="app-card c-book link" href="duckquote.html">
                <span class="link-emoji">📚</span>
                <span class="link-name">鸭语录集</span>
                <span class="link-sub">全部语录回顾</span>
            </a>

        </section>

        <!-- 右侧：个人信息侧边栏 -->
        <aside class="sidebar">
            <div class="duck"><img src="icon.png" alt="DengDuck 头像"></div>
            <span class="greeting" id="greeting">欢迎回家</span>
            <h1 class="side-title">DengDuck<br>の 小窝</h1>
            <div class="title-deco"></div>
            <p class="tagline">
                这里是 Duck 的小小角落，<br>
                <span class="heart">愿你今天一切顺利，生活幸福</span> 🧡
            </p>
            <div class="side-date" id="sideDate"></div>

            <div class="side-spacer"></div>

            <div class="side-credit">
                Made with <span class="heart">♥</span> by DengDuck<br>
                Trae 辅助生成
            </div>
        </aside>
    </main>

    <dialog class="folder-dialog" id="learningDialog" aria-labelledby="learningTitle" aria-describedby="learningDescription">
        <div class="folder-heading">
            <h2 id="learningTitle">📂 学习</h2>
            <button class="folder-close" id="closeLearning" type="button" aria-label="关闭学习文件夹" autofocus>×</button>
        </div>
        <p class="folder-description" id="learningDescription">把知识慢慢装进口袋。今天想从哪一项开始？</p>
        <nav class="folder-apps" aria-label="学习内容">
            <a class="app-card c-pinyin link" href="pinyin.html">
                <span class="link-emoji" aria-hidden="true">📖</span>
                <span class="link-name">字音练习</span>
                <span class="link-sub">多音字读音训练</span>
            </a>
            <a class="app-card c-drug link" href="DrugsExam.html">
                <span class="link-emoji" aria-hidden="true">💊</span>
                <span class="link-name">禁毒练习</span>
                <span class="link-sub">8 分钟知识小测</span>
            </a>
            <a class="app-card c-hcia link" href="hcia-learning/">
                <span class="link-emoji" aria-hidden="true">🌐</span>
                <span class="link-name">HCIA 学习站</span>
                <span class="link-sub">网络知识 · 互动实验</span>
            </a>
        </nav>
    </dialog>

    <script>
        // ===== 学习文件夹 =====
        (function () {
            const folder = document.getElementById('learningFolder');
            const dialog = document.getElementById('learningDialog');
            const close = document.getElementById('closeLearning');
            folder.addEventListener('click', function () {
                dialog.showModal();
                folder.setAttribute('aria-expanded', 'true');
                document.body.classList.add('folder-open');
            });
            close.addEventListener('click', function () { dialog.close(); });
            dialog.addEventListener('keydown', function (event) {
                if (event.key !== 'Tab') return;
                const controls = dialog.querySelectorAll('button, a[href]');
                const first = controls[0];
                const last = controls[controls.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault(); last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault(); first.focus();
                }
            });
            dialog.addEventListener('click', function (event) {
                const bounds = dialog.getBoundingClientRect();
                if (event.target === dialog && (event.clientX < bounds.left || event.clientX > bounds.right ||
                    event.clientY < bounds.top || event.clientY > bounds.bottom)) dialog.close();
            });
            dialog.addEventListener('close', function () {
                folder.setAttribute('aria-expanded', 'false');
                document.body.classList.remove('folder-open');
                folder.focus({ preventScroll: true });
            });
            // Restore a usable homepage when returning through the browser's back cache.
            window.addEventListener('pageshow', function (event) {
                if (event.persisted && dialog.open) dialog.close();
            });
        })();

        // ===== 时段问候 =====
        (function () {
            const hour = new Date().getHours();
            let text;
            if (hour >= 5 && hour < 11) {
                text = '早上好呀 · 新的一天元气满满';
            } else if (hour >= 11 && hour < 14) {
                text = '中午好 · 记得好好吃饭';
            } else if (hour >= 14 && hour < 18) {
                text = '下午好 · 来喝杯茶歇一歇';
            } else if (hour >= 18 && hour < 23) {
                text = '晚上好 · 辛苦啦，欢迎回家';
            } else {
                text = '夜深了 · 早点休息哦';
            }
            document.getElementById('greeting').textContent = text;

            // 侧边栏日期
            const now = new Date();
            const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
            document.getElementById('sideDate').textContent =
                now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + week;
        })();

        // ===== 澳门今日天气（Open-Meteo，免密钥）=====
        (function () {
            const iconEl = document.getElementById('wIcon');
            const tempEl = document.getElementById('wTemp');
            const descEl = document.getElementById('wDesc');
            const extraEl = document.getElementById('wExtra');
            const card = document.getElementById('weatherCard');

            // WMO 天气代码 -> [中文描述, 表情]
            const codes = {
                0: ['晴', '☀️'], 1: ['大致晴朗', '🌤️'], 2: ['局部多云', '⛅'], 3: ['阴', '☁️'],
                45: ['有雾', '🌫️'], 48: ['雾凇', '🌫️'],
                51: ['小毛毛雨', '🌦️'], 53: ['毛毛雨', '🌦️'], 55: ['大毛毛雨', '🌧️'],
                56: ['冻毛毛雨', '🌧️'], 57: ['冻雨', '🌧️'],
                61: ['小雨', '🌦️'], 63: ['中雨', '🌧️'], 65: ['大雨', '🌧️'],
                66: ['冻雨', '🌧️'], 67: ['强冻雨', '🌧️'],
                71: ['小雪', '🌨️'], 73: ['中雪', '🌨️'], 75: ['大雪', '❄️'], 77: ['雪粒', '🌨️'],
                80: ['小阵雨', '🌦️'], 81: ['阵雨', '🌧️'], 82: ['强阵雨', '⛈️'],
                85: ['阵雪', '🌨️'], 86: ['强阵雪', '❄️'],
                95: ['雷阵雨', '⛈️'], 96: ['雷雨伴冰雹', '⛈️'], 99: ['强雷雨冰雹', '⛈️']
            };

            function loadWeather() {
                descEl.textContent = '加载中…';
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=22.1987&longitude=113.5439'
                    + '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m'
                    + '&timezone=Asia%2FMacau&forecast_days=1';
                fetch(url)
                    .then(r => r.json())
                    .then(d => {
                        const c = d.current;
                        const info = codes[c.weather_code] || ['未知天气', '🌈'];
                        iconEl.textContent = info[1];
                        tempEl.textContent = Math.round(c.temperature_2m) + '°';
                        descEl.textContent = info[0];
                        extraEl.textContent = '湿度 ' + c.relative_humidity_2m + '% · 风速 ' + Math.round(c.wind_speed_10m) + ' km/h';
                    })
                    .catch(() => {
                        descEl.textContent = '天气加载失败';
                        extraEl.textContent = '点击卡片重试';
                    });
            }

            card.addEventListener('click', loadWeather);
            loadWeather();
        })();

        // ===== 一言：古诗词，失败用本地诗句兜底 =====
        (function () {
            const box = document.getElementById('hitokoto');
            const textEl = document.getElementById('h-text');
            const fromEl = document.getElementById('h-from');

            const fallback = [
                { h: '长风破浪会有时，直挂云帆济沧海。', f: '李白《行路难》' },
                { h: '会当凌绝顶，一览众山小。', f: '杜甫《望岳》' },
                { h: '海内存知己，天涯若比邻。', f: '王勃《送杜少府之任蜀州》' },
                { h: '山重水复疑无路，柳暗花明又一村。', f: '陆游《游山西村》' },
                { h: '莫愁前路无知己，天下谁人不识君。', f: '高适《别董大》' },
                { h: '欲穷千里目，更上一层楼。', f: '王之涣《登鹳雀楼》' },
                { h: '千磨万击还坚劲，任尔东西南北风。', f: '郑燮《竹石》' },
                { h: '但愿人长久，千里共婵娟。', f: '苏轼《水调歌头》' }
            ];
            let localIdx = Math.floor(Math.random() * fallback.length);

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function show(text, from) {
                var parts = String(text).match(/[^，。；！？、,.;!?…]+[，。；！？、,.;!?…]?/g) || [text];
                textEl.innerHTML = parts.map(function (p) {
                    return '<span class="h-line">' + escapeHtml(p) + '</span>';
                }).join('');
                fromEl.textContent = from ? '—— ' + from : '↻ 点击换一句';
                textEl.style.animation = 'none';
                void textEl.offsetWidth;
                textEl.style.animation = 'cardFade 0.5s ease both';
            }

            function showLocal() {
                const q = fallback[localIdx % fallback.length];
                localIdx++;
                show(q.h, q.f);
            }

            function loadHitokoto() {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 5000);
                fetch('https://v1.hitokoto.cn/?encode=json&c=i', { signal: controller.signal })
                    .then(r => r.json())
                    .then(d => {
                        clearTimeout(timer);
                        if (d && d.hitokoto) {
                            let from = '';
                            if (d.from_who) from = d.from_who + (d.from ? '《' + d.from + '》' : '');
                            else if (d.from) from = '《' + d.from + '》';
                            show(d.hitokoto, from);
                        } else {
                            showLocal();
                        }
                    })
                    .catch(() => { clearTimeout(timer); showLocal(); });
            }

            box.addEventListener('click', loadHitokoto);
            loadHitokoto();
        })();

        // ===== 今日随机鸭语录 =====
        (function () {
            var box = document.getElementById('duckQuote');
            var contentEl = document.getElementById('dqContent');
            var timeEl = document.getElementById('dqTime');
            var quotes = [];
            var lastIdx = -1;

            function pick() {
                if (quotes.length === 0) return;
                var idx;
                do { idx = Math.floor(Math.random() * quotes.length); }
                while (quotes.length > 1 && idx === lastIdx);
                lastIdx = idx;
                var q = quotes[idx];
                contentEl.textContent = q.content;
                timeEl.textContent = q.time || '';
                contentEl.style.animation = 'none';
                void contentEl.offsetWidth;
                contentEl.style.animation = 'cardFade 0.5s ease both';
            }

            fetch('duckquotes.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.length > 0) {
                        quotes = data;
                        pick();
                    } else {
                        contentEl.textContent = '还没有鸭语录，快去添加第一条吧';
                        timeEl.textContent = '';
                    }
                })
                .catch(function () {
                    contentEl.textContent = '语录本打不开…';
                    timeEl.textContent = '';
                });

            box.addEventListener('click', pick);
        })();
    </script>
</body>
