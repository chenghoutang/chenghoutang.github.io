<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DengDuck の 小窝</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-warm-1: #fff6ec;
            --bg-warm-2: #ffe8d2;
            --bg-warm-3: #ffd9b8;
            --text-main: #5a4130;
            --text-soft: #8a6f58;
            --accent: #e8913f;
            --accent-deep: #d97a2b;
            --accent-soft: #f6c084;
            --pink: #f2a9a0;
            --shadow-soft: 0 10px 40px rgba(186, 124, 58, 0.18);
            --shadow-hover: 0 16px 48px rgba(186, 124, 58, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', '宋体', 'PingFang SC', 'Microsoft YaHei', serif;
            color: var(--text-main);
            background: linear-gradient(160deg, var(--bg-warm-1) 0%, var(--bg-warm-2) 55%, var(--bg-warm-3) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px 70px;
            position: relative;
        }

        /* 背景柔光 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: rgba(246, 192, 132, 0.45);
            top: -120px;
            left: -100px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: rgba(242, 169, 160, 0.35);
            bottom: -120px;
            right: -90px;
        }

        /* ===== 漂浮装饰 ===== */
        .deco {
            position: fixed;
            pointer-events: none;
            user-select: none;
            opacity: 0.55;
            z-index: 0;
            animation: drift linear infinite;
        }

        .deco.d1 { top: 8%;  left: 6%;  font-size: 2.6rem; animation-duration: 14s; }
        .deco.d2 { top: 18%; right: 8%; font-size: 2.1rem; animation-duration: 18s; animation-delay: -4s; }
        .deco.d3 { bottom: 14%; left: 10%; font-size: 2.3rem; animation-duration: 16s; animation-delay: -8s; }
        .deco.d4 { bottom: 22%; right: 12%; font-size: 2.8rem; animation-duration: 20s; animation-delay: -2s; }
        .deco.d5 { top: 48%; left: 3%;  font-size: 1.7rem; animation-duration: 12s; animation-delay: -6s; }
        .deco.d6 { top: 55%; right: 4%; font-size: 1.9rem; animation-duration: 15s; animation-delay: -10s; }

        @keyframes drift {
            0%   { transform: translateY(0) rotate(-4deg); }
            50%  { transform: translateY(-26px) rotate(5deg); }
            100% { transform: translateY(0) rotate(-4deg); }
        }

        /* ===== 开放式页面容器（无卡片）===== */
        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            text-align: center;
            animation: pageIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 头像 ===== */
        .duck {
            line-height: 1;
            display: inline-block;
            position: relative;
            animation: bob 4s ease-in-out infinite;
        }

        /* 外层柔光晕 */
        .duck::before {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 145, 63, 0.25) 0%, rgba(242, 169, 160, 0.15) 50%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        /* 渐变光环 */
        .duck::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-soft), var(--pink), var(--accent), var(--accent-soft));
            animation: ringSpin 8s linear infinite;
            z-index: 0;
        }

        .duck img {
            position: relative;
            z-index: 1;
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 8px 24px rgba(217, 122, 43, 0.3);
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50%      { opacity: 1; transform: scale(1.08); }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        /* ===== 问候胶囊 ===== */
        .greeting {
            display: inline-block;
            margin-top: 22px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--accent-deep);
            letter-spacing: 0.12em;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            padding: 8px 22px;
            box-shadow: 0 4px 16px rgba(186, 124, 58, 0.12);
        }

        .greeting .dot {
            margin: 0 6px;
            color: var(--accent-soft);
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            font-size: 3rem;
            font-weight: 400;
            color: var(--text-main);
            margin-top: 20px;
            letter-spacing: 0.08em;
            line-height: 1.35;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.6);
        }

        .title-deco {
            margin: 18px auto 0;
            height: 2px;
            width: 140px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .tagline {
            margin-top: 18px;
            font-size: 1.02rem;
            color: var(--text-soft);
            font-weight: 500;
            line-height: 1.9;
            letter-spacing: 0.05em;
        }

        .tagline .heart {
            color: var(--pink);
            font-weight: 700;
        }

        /* ===== 一言（诗句排版，无边框）===== */
        .hitokoto {
            margin: 40px auto 0;
            max-width: 440px;
            padding: 0 20px;
            cursor: pointer;
            background: none;
            border: none;
            position: relative;
        }

        .hitokoto .h-text {
            font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', 'Noto Serif SC', serif;
            font-size: 1.6rem;
            line-height: 2.1;
            color: var(--text-main);
            letter-spacing: 0.06em;
            font-weight: 400;
        }

        .hitokoto .h-line {
            display: block;
            white-space: nowrap;
        }

        .hitokoto .h-divider {
            width: 36px;
            height: 1px;
            margin: 16px auto 10px;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
        }

        .hitokoto .h-from {
            font-size: 0.82rem;
            color: var(--text-soft);
            letter-spacing: 0.12em;
        }

        .hitokoto .h-tip {
            display: block;
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--accent-soft);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .hitokoto:hover .h-tip { opacity: 1; }

        @keyframes hFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 今日随机鸭语录 ===== */
        .duck-quote {
            margin: 40px auto 0;
            max-width: 440px;
            padding: 0 20px;
            cursor: pointer;
            position: relative;
        }

        .duck-quote .dq-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-deep);
            letter-spacing: 0.15em;
            margin-bottom: 12px;
        }

        .duck-quote .dq-label .badge {
            background: linear-gradient(135deg, var(--accent-soft), var(--accent));
            color: #fff;
            font-size: 0.68rem;
            padding: 2px 10px;
            border-radius: 999px;
            letter-spacing: 0.08em;
        }

        .duck-quote .dq-content {
            font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', serif;
            font-size: 1.4rem;
            line-height: 1.9;
            color: var(--text-main);
            letter-spacing: 0.04em;
        }

        .duck-quote .dq-time {
            margin-top: 10px;
            font-size: 0.76rem;
            color: var(--text-soft);
            letter-spacing: 0.08em;
        }

        .duck-quote .dq-tip {
            display: block;
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--accent-soft);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .duck-quote:hover .dq-tip { opacity: 1; }

        /* ===== 入口按钮 ===== */
        .enter-actions {
            margin-top: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px 44px;
            font-family: inherit;
            font-size: 1.12rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 45%, var(--accent-deep) 100%);
            border-radius: 999px;
            box-shadow: 0 10px 28px rgba(217, 122, 43, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: btnPulse 2.4s ease-in-out infinite;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: var(--shadow-hover);
        }

        .enter-btn:active {
            transform: translateY(0) scale(0.99);
        }

        .enter-btn .arrow {
            transition: transform 0.25s ease;
        }

        .enter-btn:hover .arrow {
            transform: translateX(5px);
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 10px 28px rgba(217, 122, 43, 0.4); }
            50%      { box-shadow: 0 10px 36px rgba(217, 122, 43, 0.6); }
        }

        .enter-btn.secondary {
            color: var(--accent-deep);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 22px rgba(217, 122, 43, 0.18);
            animation: none;
        }

        .enter-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 14px 32px rgba(217, 122, 43, 0.28);
        }

        .enter-sub {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-soft);
            letter-spacing: 0.1em;
        }

        /* ===== 页脚 ===== */
        .footer {
            position: fixed;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-soft);
            letter-spacing: 0.08em;
            z-index: 1;
            opacity: 0.85;
        }

        .footer .heart { color: #e07a5f; }

        /* ===== 移动端 ===== */
        @media (max-width: 600px) {
            body { padding: 30px 16px 60px; }
            h1 { font-size: 2.4rem; }
            .duck img { width: 108px; height: 108px; }
            .hitokoto .h-text { font-size: 1.3rem; }
            .duck-quote .dq-content { font-size: 1.15rem; }
            .enter-btn {
                padding: 14px 36px;
                font-size: 1.05rem;
            }
            .deco { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <!-- 漂浮的小装饰 -->
    <div class="deco d1">🪶</div>
    <div class="deco d2">✨</div>
    <div class="deco d3">☕</div>
    <div class="deco d4">🌙</div>
    <div class="deco d5">🍂</div>
    <div class="deco d6">⭐</div>

    <main class="page">
        <div class="duck"><img src="icon.png" alt="DengDuck 头像"></div>
        <div>
            <span class="greeting" id="greeting">欢迎回家<span class="dot">·</span>今天也要开心呀</span>
        </div>
        <h1>欢迎来到<br>DengDuck の 小窝</h1>
        <div class="title-deco"></div>
        <p class="tagline">
            这里是 Duck 的小小角落，<br>
            <span class="heart">愿你今天一切顺利，生活幸福</span> 🧡
        </p>

        <blockquote class="hitokoto" id="hitokoto" title="点击换一句">
            <div class="h-text" id="h-text">一言加载中…</div>
            <div class="h-divider"></div>
            <div class="h-from" id="h-from"></div>
            <span class="h-tip">↻ 点击换一句</span>
        </blockquote>

        <div class="duck-quote" id="duckQuote" title="点击换一条">
            <div class="dq-label">
                <span>🐤</span>
                <span>今日随机鸭语录</span>
                <span class="badge">DUCK</span>
            </div>
            <div class="dq-content" id="dqContent">鸭语录加载中…</div>
            <div class="dq-time" id="dqTime"></div>
            <span class="dq-tip">↻ 点击换一条 · <a href="duckquote.html" style="color:var(--accent-deep);text-decoration:none;">查看全部 →</a></span>
        </div>

        <div class="enter-actions">
            <a class="enter-btn" href="pinyin.html">
                <span>📖 进入字音练习</span>
                <span class="arrow">→</span>
            </a>
            <a class="enter-btn secondary" href="DrugsExam.html">
                <span>💊 禁毒知识考试</span>
                <span class="arrow">→</span>
            </a>
            <a class="enter-btn secondary" href="duckquote.html">
                <span>🐤 鸭语录集</span>
                <span class="arrow">→</span>
            </a>
        </div>
        <div class="enter-sub">多音字读音训练 · 8 分钟禁毒小测 · 鸭语录</div>
    </main>

    <footer class="footer">
        Made with <span class="heart">♥</span> by DengDuck · Trae 辅助生成
    </footer>

    <script>
        // 根据时间显示不同的问候语
        (function () {
            const hour = new Date().getHours();
            let text;
            if (hour >= 5 && hour < 11) {
                text = '早上好呀 · 新的一天元气满满';
            } else if (hour >= 11 && hour < 14) {
                text = '中午好 · 记得好好吃饭';
            } else if (hour >= 14 && hour < 18) {
                text = '下午好 · 来喝杯茶歇一歇';
            } else if (hour >= 18 && hour < 23) {
                text = '晚上好 · 辛苦啦，欢迎回家';
            } else {
                text = '夜深了 · 早点休息哦';
            }
            document.getElementById('greeting').textContent = text;
        })();

        // 一言：优先从 hitokoto API 获取古诗词，失败/超时则用本地诗句兜底
        (function () {
            const box = document.getElementById('hitokoto');
            const textEl = document.getElementById('h-text');
            const fromEl = document.getElementById('h-from');

            const fallback = [
                { h: '长风破浪会有时，直挂云帆济沧海。', f: '李白《行路难》' },
                { h: '会当凌绝顶，一览众山小。', f: '杜甫《望岳》' },
                { h: '海内存知己，天涯若比邻。', f: '王勃《送杜少府之任蜀州》' },
                { h: '山重水复疑无路，柳暗花明又一村。', f: '陆游《游山西村》' },
                { h: '莫愁前路无知己，天下谁人不识君。', f: '高适《别董大》' },
                { h: '欲穷千里目，更上一层楼。', f: '王之涣《登鹳雀楼》' },
                { h: '千磨万击还坚劲，任尔东西南北风。', f: '郑燮《竹石》' },
                { h: '但愿人长久，千里共婵娟。', f: '苏轼《水调歌头》' }
            ];
            let localIdx = Math.floor(Math.random() * fallback.length);

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function show(text, from) {
                // 按句读标点断句，每小句独占一行，避免在行中任意位置折行
                var parts = String(text).match(/[^，。；！？、,.;!?…]+[，。；！？、,.;!?…]?/g) || [text];
                textEl.innerHTML = parts.map(function (p) {
                    return '<span class="h-line">' + escapeHtml(p) + '</span>';
                }).join('');
                fromEl.textContent = from ? '—— ' + from : '';
                textEl.style.animation = 'none';
                void textEl.offsetWidth;  // 触发重绘以重启动画
                textEl.style.animation = 'hFade 0.5s ease both';
            }

            function showLocal() {
                const q = fallback[localIdx % fallback.length];
                localIdx++;
                show(q.h, q.f);
            }

            function loadHitokoto() {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 5000);
                fetch('https://v1.hitokoto.cn/?encode=json&c=i', { signal: controller.signal })
                    .then(r => r.json())
                    .then(d => {
                        clearTimeout(timer);
                        if (d && d.hitokoto) {
                            let from = '';
                            if (d.from_who) from = d.from_who + (d.from ? '《' + d.from + '》' : '');
                            else if (d.from) from = '《' + d.from + '》';
                            show(d.hitokoto, from);
                        } else {
                            showLocal();
                        }
                    })
                    .catch(() => { clearTimeout(timer); showLocal(); });
            }

            box.addEventListener('click', loadHitokoto);
            loadHitokoto();
        })();

        // 今日随机鸭语录：读取 duckquotes.json 随机展示
        (function () {
            var box = document.getElementById('duckQuote');
            var contentEl = document.getElementById('dqContent');
            var timeEl = document.getElementById('dqTime');
            var quotes = [];

            function pick() {
                if (quotes.length === 0) return;
                var q = quotes[Math.floor(Math.random() * quotes.length)];
                contentEl.textContent = q.content;
                timeEl.textContent = q.time;
                contentEl.style.animation = 'none';
                void contentEl.offsetWidth;
                contentEl.style.animation = 'hFade 0.5s ease both';
            }

            fetch('duckquotes.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.length > 0) {
                        quotes = data;
                        pick();
                    } else {
                        contentEl.textContent = '还没有鸭语录，用 addquote.bat 添加第一条吧';
                        timeEl.textContent = '';
                    }
                })
                .catch(function () {
                    contentEl.textContent = '语录本打不开…';
                    timeEl.textContent = '';
                });

            box.addEventListener('click', function (e) {
                if (e.target.tagName === 'A') return; // 不拦截"查看全部"链接
                pick();
            });
        })();
    </script>
</body>
</html>
