<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DengDuck の 小窝</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #1a1410;
            --bg-1: #2a1f17;
            --bg-2: #3d2c1e;
            --text: #f5ece0;
            --text-dim: #c4a884;
            --text-faint: #8a7460;
            --accent: #e8913f;
            --accent-glow: rgba(232, 145, 63, 0.15);
            --line: rgba(196, 168, 132, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            color: var(--text);
            background: var(--bg-0);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px 64px;
            position: relative;
        }

        /* 背景：深色 + 暖光 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, var(--bg-2) 0%, var(--bg-1) 40%, var(--bg-0) 80%);
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            top: -200px;
            right: -150px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            text-align: center;
            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 头像 ===== */
        .avatar-wrap {
            display: inline-block;
            position: relative;
            margin-bottom: 28px;
        }

        .avatar-wrap img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(245, 236, 224, 0.12);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .avatar-wrap:hover img {
            transform: scale(1.05);
        }

        .avatar-wrap::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid var(--line);
            transition: border-color 0.4s ease;
        }

        .avatar-wrap:hover::after {
            border-color: rgba(232, 145, 63, 0.4);
        }

        /* ===== 问候 ===== */
        .greeting {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-faint);
            letter-spacing: 0.15em;
            margin-bottom: 8px;
        }

        /* ===== 标题 ===== */
        h1 {
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            font-size: 2.6rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: 0.06em;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 0.08em;
            line-height: 1.8;
        }

        /* ===== 分隔线 ===== */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--line);
            margin: 36px 0 32px;
        }

        /* ===== 一言 ===== */
        .hitokoto {
            cursor: pointer;
            padding: 0 16px;
            transition: opacity 0.3s ease;
        }

        .hitokoto .h-text {
            font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', serif;
            font-size: 1.45rem;
            line-height: 2.2;
            color: var(--text);
            letter-spacing: 0.06em;
            font-weight: 400;
        }

        .hitokoto .h-line {
            display: block;
            white-space: nowrap;
        }

        .hitokoto .h-from {
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--text-faint);
            letter-spacing: 0.15em;
            font-weight: 300;
        }

        .hitokoto .h-tip {
            display: block;
            margin-top: 10px;
            font-size: 0.68rem;
            color: var(--text-faint);
            letter-spacing: 0.3em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hitokoto:hover .h-tip { opacity: 0.7; }

        @keyframes hFade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 按钮 ===== */
        .actions {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 300px;
            padding: 15px 32px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text);
            text-decoration: none;
            background: rgba(245, 236, 224, 0.04);
            border: 1px solid var(--line);
            border-radius: 12px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(232, 145, 63, 0.08);
            border-color: rgba(232, 145, 63, 0.35);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            color: var(--accent);
            border-color: rgba(232, 145, 63, 0.25);
            background: rgba(232, 145, 63, 0.06);
        }

        .btn-primary:hover {
            background: rgba(232, 145, 63, 0.12);
            border-color: rgba(232, 145, 63, 0.5);
        }

        .btn .arrow {
            font-size: 0.9em;
            opacity: 0.5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .btn:hover .arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* ===== 页脚 ===== */
        .footer {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.74rem;
            color: var(--text-faint);
            letter-spacing: 0.1em;
            z-index: 1;
            opacity: 0.5;
            font-weight: 300;
        }

        /* ===== 移动端 ===== */
        @media (max-width: 600px) {
            body { padding: 36px 16px 56px; }
            h1 { font-size: 2.1rem; }
            .avatar-wrap img { width: 96px; height: 96px; }
            .hitokoto .h-text { font-size: 1.2rem; }
            .btn { padding: 13px 28px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="avatar-wrap">
            <img src="icon.png" alt="DengDuck">
        </div>
        <div class="greeting" id="greeting">你好</div>
        <h1>DengDuck の 小窝</h1>
        <p class="subtitle">愿你今天一切顺利，生活幸福</p>

        <div class="divider"></div>

        <blockquote class="hitokoto" id="hitokoto" title="点击换一句">
            <div class="h-text" id="h-text">一言加载中…</div>
            <div class="h-from" id="h-from"></div>
            <span class="h-tip">↻ 点击换一句</span>
        </blockquote>

        <div class="actions">
            <a class="btn btn-primary" href="pinyin.html">
                <span>字音练习</span>
                <span class="arrow">→</span>
            </a>
            <a class="btn" href="DrugsExam.html">
                <span>禁毒知识考试</span>
                <span class="arrow">→</span>
            </a>
        </div>
    </main>

    <footer class="footer">
        Made with ♥ by DengDuck · Trae 辅助生成
    </footer>

    <script>
        // 根据时间显示不同的问候语
        (function () {
            const hour = new Date().getHours();
            let text;
            if (hour >= 5 && hour < 11) text = '早安，新的一天';
            else if (hour >= 11 && hour < 14) text = '午安，记得吃饭';
            else if (hour >= 14 && hour < 18) text = '下午好，歇口气吧';
            else if (hour >= 18 && hour < 23) text = '晚上好，辛苦了';
            else text = '夜深了，早些休息';
            document.getElementById('greeting').textContent = text;
        })();

        // 一言：优先从 hitokoto API 获取古诗词，失败/超时则用本地诗句兜底
        (function () {
            const box = document.getElementById('hitokoto');
            const textEl = document.getElementById('h-text');
            const fromEl = document.getElementById('h-from');

            const fallback = [
                { h: '长风破浪会有时，直挂云帆济沧海。', f: '李白《行路难》' },
                { h: '会当凌绝顶，一览众山小。', f: '杜甫《望岳》' },
                { h: '海内存知己，天涯若比邻。', f: '王勃《送杜少府之任蜀州》' },
                { h: '山重水复疑无路，柳暗花明又一村。', f: '陆游《游山西村》' },
                { h: '莫愁前路无知己，天下谁人不识君。', f: '高适《别董大》' },
                { h: '欲穷千里目，更上一层楼。', f: '王之涣《登鹳雀楼》' },
                { h: '千磨万击还坚劲，任尔东西南北风。', f: '郑燮《竹石》' },
                { h: '但愿人长久，千里共婵娟。', f: '苏轼《水调歌头》' }
            ];
            let localIdx = Math.floor(Math.random() * fallback.length);

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function show(text, from) {
                var parts = String(text).match(/[^，。；！？、,.;!?…]+[，。；！？、,.;!?…]?/g) || [text];
                textEl.innerHTML = parts.map(function (p) {
                    return '<span class="h-line">' + escapeHtml(p) + '</span>';
                }).join('');
                fromEl.textContent = from ? '—— ' + from : '';
                textEl.style.animation = 'none';
                void textEl.offsetWidth;
                textEl.style.animation = 'hFade 0.5s ease both';
            }

            function showLocal() {
                const q = fallback[localIdx % fallback.length];
                localIdx++;
                show(q.h, q.f);
            }

            function loadHitokoto() {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 5000);
                fetch('https://v1.hitokoto.cn/?encode=json&c=i', { signal: controller.signal })
                    .then(r => r.json())
                    .then(d => {
                        clearTimeout(timer);
                        if (d && d.hitokoto) {
                            let from = '';
                            if (d.from_who) from = d.from_who + (d.from ? '《' + d.from + '》' : '');
                            else if (d.from) from = '《' + d.from + '》';
                            show(d.hitokoto, from);
                        } else {
                            showLocal();
                        }
                    })
                    .catch(() => { clearTimeout(timer); showLocal(); });
            }

            box.addEventListener('click', loadHitokoto);
            loadHitokoto();
        })();
    </script>
</body>
</html>
